<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chem Puzzles</title>
<meta name="theme-color" content="#e4e4e0">
<style>
:root{
  --bg:#e4e4e0; --board:#f4f4f1; --card:#fbfbf9; --line:#d3d3cd; --line2:#c4c4bd;
  --text:#1d1f22; --muted:#686c72; --accent:#2c64c9; --accent-soft:rgba(44,100,201,.13);
  --good:#4b8a1d; --good-soft:rgba(75,138,29,.14); --bad:#c0392b; --bad-soft:rgba(192,57,43,.12);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--text);background:var(--bg);display:flex;flex-direction:column;min-height:100vh}
button,select,input{font:inherit;color:inherit}
a{color:inherit}

/* header */
.top{height:52px;flex:none;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--line);background:#ececE8}
.brand{font-weight:700;font-size:17px;letter-spacing:.1px;text-decoration:none}
.home{color:var(--muted);text-decoration:none;font-size:14px}
.home:hover{color:var(--text)}
.spacer{flex:1}
.filter{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.filter select{border:1px solid var(--line2);background:var(--card);border-radius:6px;padding:5px 8px;color:var(--text)}
.rating{display:flex;align-items:baseline;gap:8px;padding:4px 12px;border:1px solid var(--line2);border-radius:6px;background:var(--card)}
.rating .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.rating b{font-size:18px;font-variant-numeric:tabular-nums}
.rating .tier{font-size:13px;color:var(--muted)}

/* layout */
.layout{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;padding:18px 20px 20px;min-height:0}
.board{background:var(--board);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 10px 30px -18px rgba(0,0,0,.25);
  display:flex;flex-direction:column;min-height:calc(100vh - 52px - 38px);padding:28px 32px 26px;position:relative}
.prompt{font-size:21px;line-height:1.45;max-width:980px;margin:0 auto;text-align:center}
.prompt b{font-weight:650}
.sub{font-size:14px;color:var(--muted);text-align:center;margin-top:6px}
.stage{flex:1;display:flex;align-items:center;justify-content:center;gap:18px;min-height:220px;padding:18px 0;flex-wrap:wrap}
.answers{width:100%;max-width:880px;margin:0 auto}

/* molecules */
svg.mol{display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none;max-width:100%;height:auto}
.mol .bd{stroke:var(--text);stroke-width:.055;stroke-linecap:round;fill:none}
.mol .ghost{stroke:var(--muted);stroke-width:.035;stroke-dasharray:.08 .14}
.mol .wedge{fill:var(--text)}
.mol .lbl{font-family:var(--font);font-weight:500;fill:var(--text);dominant-baseline:central;text-anchor:middle}
.mol .chg{font-family:var(--font);font-weight:600;fill:var(--text)}
.mol .lpd{fill:var(--text)}
.mol .hl{fill:rgba(44,100,201,.22);stroke:var(--accent);stroke-width:.04}
.mol .hit{fill:transparent;stroke:none;cursor:pointer}
.mol .hit:hover,.mol .hit.armed{fill:var(--accent-soft)}
.mol .bhit{stroke:transparent;stroke-width:.28;stroke-linecap:round;fill:none;cursor:pointer}
.mol .bhit:hover,.mol .bhit.armed{stroke:var(--accent-soft)}
.mol .mark{fill:none;stroke-width:.06}
.mol .mark.ok{stroke:var(--good);fill:var(--good-soft)}
.mol .mark.no{stroke:var(--bad);fill:var(--bad-soft)}
.mol .mark.sol{stroke:var(--good);stroke-dasharray:.1 .08}
.mol .arr{fill:none;stroke:var(--accent);stroke-width:.06;stroke-linecap:round}
.mol .arr.sol{stroke:var(--good)}
.mol .arr.tmp{stroke-dasharray:.12 .12;opacity:.7}
.mol .ahit{fill:none;stroke:transparent;stroke-width:.3;cursor:pointer}
.mol .ahit:hover+.arr{stroke:var(--bad)}

/* reaction scheme */
.scheme{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:nowrap;max-width:100%;width:100%}
.scheme>svg{flex:0 1 auto;max-width:42%}
.board.nostage{justify-content:center;gap:34px}
.board.nostage .stage{display:none}
.board.nostage .prompt{font-size:26px}
.rarrow{display:flex;flex-direction:column;align-items:center;flex:0 1 240px;min-width:96px;font-size:15px;color:var(--text);text-align:center;gap:4px}
.rarrow .rgt{line-height:1.35}
.rarrow svg{width:100%;height:14px}
.qbox{width:120px;height:96px;border:2px dashed var(--line2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--muted);font-weight:300}
.formula{font-size:30px;font-weight:500;letter-spacing:.4px}

/* answer controls */
.opts{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.row{grid-template-columns:repeat(auto-fit,minmax(110px,1fr));max-width:560px;margin:0 auto}
.opts.one{grid-template-columns:1fr;max-width:760px;margin:0 auto}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 16px;border:1px solid var(--line2);border-radius:8px;background:var(--card);cursor:pointer;font-size:17px;line-height:1.35;transition:border-color .12s,background .12s,transform .08s}
.opts.row .opt{justify-content:center;font-size:20px;font-weight:600}
.opt:hover:not(:disabled){border-color:var(--accent);background:#fff}
.opt:active:not(:disabled){transform:translateY(1px)}
.opt .key{flex:none;width:22px;height:22px;border-radius:5px;border:1px solid var(--line2);font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:600}
.opts.row .opt .key{display:none}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.55}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;border:1px solid var(--line2);border-radius:10px;background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:14px;min-height:150px;transition:border-color .12s,background .12s}
.tile:hover:not(.locked){border-color:var(--accent);background:#fff}
.tile .key{position:absolute;top:8px;left:10px;font-size:12px;color:var(--muted);font-weight:600}
.tile.right{border-color:var(--good);background:var(--good-soft)}
.tile.wrong{border-color:var(--bad);background:var(--bad-soft)}
.tile.locked{cursor:default}
.typed{display:flex;gap:10px;max-width:620px;margin:0 auto}
.typed input{flex:1;min-width:0;padding:12px 14px;font-size:19px;border:1px solid var(--line2);border-radius:8px;background:var(--card);outline:none}
.typed input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.typed input.right{border-color:var(--good);background:var(--good-soft)}
.typed input.wrong{border-color:var(--bad);background:var(--bad-soft)}
.btn{border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600;font-size:15px}
.btn:hover:not(:disabled){border-color:var(--text)}
.btn.primary{background:var(--text);color:#fff;border-color:var(--text)}
.btn.primary:hover:not(:disabled){background:#000}
.btn:disabled{opacity:.45;cursor:default}
.tools{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.counter{text-align:center;font-size:15px;color:var(--muted);margin-top:4px}
.order{list-style:none;margin:0 auto;padding:0;display:grid;gap:8px;max-width:520px}
.order li{display:flex;align-items:center;gap:12px;padding:11px 12px;background:var(--card);border:1px solid var(--line2);border-radius:8px;font-size:17px;cursor:grab;user-select:none;touch-action:none}
.order li .n{color:var(--muted);font-weight:600;width:18px;font-variant-numeric:tabular-nums}
.order li .g{flex:1}
.order li.drag{border-color:var(--accent);box-shadow:0 8px 18px -8px rgba(0,0,0,.35);cursor:grabbing}
.order li.right{border-color:var(--good);background:var(--good-soft)}
.order li.wrong{border-color:var(--bad);background:var(--bad-soft)}
.mv{border:0;background:none;cursor:pointer;color:var(--muted);padding:2px 6px;border-radius:4px}
.mv:hover{background:var(--accent-soft);color:var(--accent)}
.ends{font-size:13px;color:var(--muted);text-align:center;margin:6px 0}
.match{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:90px;row-gap:9px;max-width:820px;margin:0 auto}
.match .m{padding:10px 14px;border:1px solid var(--line2);border-radius:8px;background:var(--card);cursor:pointer;font-size:16px;z-index:1}
.match .m.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.match svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.match path{fill:none;stroke:var(--accent);stroke-width:2}
.match path.no{stroke:var(--bad);stroke-dasharray:5 5}
/* synthesis */
.syn-goal{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:15px;color:var(--muted);margin-bottom:6px}
.chip{padding:5px 11px;border-radius:20px;border:1px solid var(--line2);background:var(--card);color:var(--text);font-weight:600;font-size:15px}
.chip.goal{border-color:var(--good)}
.route{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 6px;margin:6px 0 10px}
.route .node{padding:7px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--card);font-weight:600;font-size:15px}
.route .node.hit{border-color:var(--good);background:var(--good-soft)}
.route .node.dead{border-color:var(--bad)}
.route .step{display:flex;flex-direction:column;align-items:center;min-width:120px;max-width:190px;font-size:13px;color:var(--muted);text-align:center}
.route .step svg{width:100%;height:12px}
.note{min-height:22px;text-align:center;font-size:15px;color:var(--muted)}
.note.warn{color:var(--bad)}
.shelf{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.shelf button{padding:8px 12px;border:1px solid var(--line2);border-radius:7px;background:var(--card);cursor:pointer;font-size:14px}
.shelf button:hover{border-color:var(--accent)}

/* side panel */
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.meta .row1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.meta .pid{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta .pc{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.meta .pc small{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:6px}
.meta .theme{font-size:14px;color:var(--muted);margin-top:2px}
.badge{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:4px;margin-top:8px;background:var(--accent-soft);color:var(--accent)}
.badge.practice{background:#e8e8e4;color:var(--muted)}
.status{display:flex;align-items:center;gap:12px;min-height:66px}
.status .icon{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:#e9e9e5}
.status .icon svg{width:18px;height:18px}
.status.ok .icon{background:var(--good);color:#fff}
.status.no .icon{background:var(--bad);color:#fff}
.status .t1{font-weight:700;font-size:16px}
.status .t2{font-size:14px;color:var(--muted)}
.status .delta{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;font-size:16px}
.status.ok .delta{color:var(--good)} .status.no .delta{color:var(--bad)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.controls .wide{grid-column:1/-1}
.explain{font-size:15px;line-height:1.5}
.explain .h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.explain p{margin:0 0 6px}
.hist .h,.stats .h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.dots{display:flex;flex-wrap:wrap;gap:5px}
.dots button{width:18px;height:18px;border-radius:4px;border:0;cursor:pointer;padding:0}
.dots .s1{background:var(--good)} .dots .s0{background:var(--bad)} .dots .sh{background:#a7b97f}
.stats .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:14px}
.stats .grid b{font-variant-numeric:tabular-nums}
.foot{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;padding:0 4px}
.foot button{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;font-size:12px}

@media (max-width:980px){
  .scheme{flex-wrap:wrap}.scheme>svg{max-width:100%}
  .layout{grid-template-columns:1fr;padding:10px}
  .board{min-height:68vh;padding:20px 14px}
  .top{padding:0 12px;gap:10px}
  .filter span{display:none}
  .home{display:none}
  .brand{white-space:nowrap;font-size:16px}
  .filter select{max-width:118px}
  .rating{padding:3px 8px}
  .rating .tier{display:none}
  .prompt{font-size:18px}
  .opts{grid-template-columns:1fr}
  .tiles{gap:8px}
  .tile{min-height:120px;padding:8px}
  .match{column-gap:40px}
}
/* solved animation + hand-over to the next puzzle */
.fx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:5}
.fx .ring{width:104px;height:104px;border-radius:50%;background:var(--good);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 0 rgba(75,138,29,.45);transform:scale(.5);opacity:0;animation:fxPop .38s cubic-bezier(.2,.9,.3,1.25) forwards,fxPulse .9s .3s ease-out}
.fx svg{width:54px;height:54px}
.fx path{fill:none;stroke:#fff;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:32;stroke-dashoffset:32;animation:fxDraw .32s .22s ease-out forwards}
.fx .d{position:absolute;margin-top:150px;font-weight:700;font-size:22px;color:var(--good);opacity:0;animation:fxUp .5s .3s ease-out forwards;font-variant-numeric:tabular-nums}
.fx .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--good);border-radius:0 0 0 10px;animation:fxBar linear forwards}
@keyframes fxPop{to{transform:scale(1);opacity:1}}
@keyframes fxPulse{from{box-shadow:0 0 0 0 rgba(75,138,29,.45)}to{box-shadow:0 0 0 34px rgba(75,138,29,0)}}
@keyframes fxDraw{to{stroke-dashoffset:0}}
@keyframes fxUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fxBar{from{width:0}to{width:100%}}
.board.solved>.prompt,.board.solved>.sub,.board.solved>.stage,.board.solved>.answers{transition:opacity .25s,filter .25s;opacity:.35;filter:saturate(.6)}
.board.leaving>*{transition:opacity .18s,transform .18s;opacity:0!important;transform:translateY(-10px)}
.board.entering>.prompt,.board.entering>.sub,.board.entering>.stage,.board.entering>.answers{animation:fxIn .28s ease-out both}
@keyframes fxIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<header class="top">
  <a class="home" href="../">sketchdanylo</a><span class="home">/</span>
  <span class="brand">Chem Puzzles</span>
  <div class="spacer"></div>
  <label class="filter"><span>Theme</span><select id="theme"></select></label>
  <div class="rating" title="Your Celo"><span class="lbl">Celo</span><b id="celo">100</b><span class="tier" id="tier"></span></div>
</header>
<main class="layout">
  <section class="board" id="board" aria-live="polite">
    <div class="prompt" id="prompt"></div>
    <div class="sub" id="sub"></div>
    <div class="stage" id="stage"></div>
    <div class="answers" id="answers"></div>
  </section>
  <aside class="panel">
    <div class="card meta" id="meta"></div>
    <div class="card status" id="status"></div>
    <div class="controls">
      <button class="btn" id="hintBtn">Hint</button>
      <button class="btn" id="solBtn">Solution</button>
      <button class="btn primary wide" id="nextBtn">Next puzzle</button>
    </div>
    <div class="card explain" id="explain" hidden></div>
    <div class="card hist"><div class="h">Recent</div><div class="dots" id="dots"></div></div>
    <div class="card stats"><div class="h">Progress</div><div class="grid" id="stats"></div></div>
    <div class="foot"><span id="count"></span><button id="reset">Reset rating</button></div>
  </aside>
</main>
<script src="puzzles.js?v=a55258b1b4"></script>
<script>
'use strict';
const CP = window.CP_DATA || {M:[], P:[]};
const BY = new Map(CP.P.map(p => [p.i, p]));
const $ = (s, r = document) => r.querySelector(s);
const el = (t, a = {}, h) => { const e = document.createElement(t); for (const k in a) e.setAttribute(k, a[k]); if (h != null) e.innerHTML = h; return e; };
const NS = 'http://www.w3.org/2000/svg';
const sv = (t, a = {}) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); return e; };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const famOf = p => p.i.includes('-') ? p.i.split('-')[0] : 'hand';
const norm = s => s.toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss').normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
const TIERS = [[2800, 'Grandmaster'], [2600, 'International Master'], [2400, 'Master'], [2200, 'Candidate Master'], [1800, 'Synthesist'], [1400, 'Bench Chemist'], [1000, 'Lab Assistant'], [600, 'Apprentice'], [0, 'Novice']];
const tierOf = r => TIERS.find(t => r >= t[0])[1];
const HINT = {
  nm: 'Längste Kette mit der Hauptgruppe suchen; so nummerieren, dass Hauptgruppe bzw. Mehrfachbindung die kleinsten Lokanten bekommen; Substituenten alphabetisch ordnen.',
  fo: 'Zähle alle Atome. Jedes C bildet vier Bindungen – die fehlenden gehen zu H.', cl: 'Suche die funktionelle Gruppe – auf die Atome direkt am C=O bzw. am Heteroatom achten.',
  fp: 'Gesucht ist ein O- bzw. N-Atom mit genau einer Einfachbindung.', hy: '4 Bindungspartner → sp³, eine Doppelbindung → sp², eine Dreifachbindung oder zwei Doppelbindungen → sp.',
  ox: 'Bindungen zu O, N oder Halogenen zählen +1 (pro Bindung), zu H −1, zu C 0.', sc: 'Ein Stereozentrum trägt vier verschiedene Substituenten.',
  ez: 'Bestimme an jedem C der Doppelbindung den Rest mit höherer CIP-Priorität. Gleiche Seite → Z, entgegengesetzt → E.',
  rs: 'Niedrigste Priorität nach hinten, dann 1 → 2 → 3: im Uhrzeigersinn = R. Zeigt die niedrigste Priorität nach vorne, dreht sich das Ergebnis um.',
  ab: 'Je stabiler die korrespondierende Base (Mesomerie, −I-Effekt, Elektronegativität, Größe), desto stärker die Säure.',
  bp: 'Wasserstoffbrücken > Dipol-Dipol > Van-der-Waals; größere Oberfläche → höhere Siedetemperatur; Verzweigung senkt sie.',
  me: 'Entscheidend: Substratgrad, Nucleophil oder Base (stark/schwach, sperrig?), Lösungsmittel und Temperatur.',
  rx: 'Welche funktionelle Gruppe reagiert mit dem Reagenz? Achte auf Regioselektivität (Markownikow) und auf Oxidationsstufen.',
  tp: 'Gehe Schritt für Schritt vor und zeichne jedes Zwischenprodukt.', gr: 'Das C-Atom mit der OH-Gruppe war das Carbonyl-C. Welcher Rest kann aus dem Grignard-Reagenz stammen?',
  ss: 'SN2 → Inversion am Stereozentrum. Den Deskriptor danach mit CIP neu bestimmen.', ar: 'Pfeile beginnen an Elektronen (freies Elektronenpaar oder Bindung) und zeigen dorthin, wo die neue Bindung bzw. das Elektronenpaar landet.',
  el: 'Denk ans Periodensystem.', ba: 'Meth-, Eth-, Prop-, But-, Pent-, Hex-, Hept-, Oct-, Non-, Dec-; Alkane: CₙH₂ₙ₊₂.',
};
Object.assign(HINT, { tn: HINT.nm, sm: HINT.nm, ao: HINT.ab, rp: HINT.rx, rg: HINT.rx, re: HINT.rx, sq: HINT.tp, t3: HINT.tp, t4: HINT.tp, s3: HINT.tp, s4: HINT.tp });

/* ================= state ================= */
const KEY = 'chempuzzles.v2';
let S = (() => { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && typeof s.celo === 'number') return s; } catch (e) {}
  let old = null; try { old = JSON.parse(localStorage.getItem('chempuzzles.v1')); } catch (e) {}
  return { celo: old && old.celo || 100, games: old && old.games || 0, done: old && old.done || {}, hist: [], theme: 'all' }; })();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
function rate(p, score) {

arr(p, stage, ans) {
  const v = molView(p.tm, { arrows: true, scale: 80 }); stage.appendChild(v.svg); const svg = v.svg, uid = UID;
  const arrows = []; let drag = null, armed = null;
  const tmp = sv('path', { class: 'arr tmp', 'marker-end': `url(#ah${uid})` }); tmp.style.display = 'none'; v.gA.appendChild(tmp);
  const pt = e => { const q = svg.createSVGPoint(); q.x = e.clientX; q.y = e.clientY; return q.matrixTransform(svg.getScreenCTM().inverse()); };

  const srcPt = (k, n) => k.startsWith('lp:') ? v.geo.lps[+n.getAttribute('data-lp')] : v.geo.bonds.get(k.slice(2));
  const tgtPt = k => k.startsWith('a:') ? v.geo.atoms.get(k.slice(2)) : v.geo.bonds.get(k.slice(2));

    if ((mx + nx - v.geo.cx) ** 2 + (my + ny - v.geo.cy) ** 2 < (mx - nx - v.geo.cx) ** 2 + (my - ny - v.geo.cy) ** 2) { nx = -nx; ny = -ny; }
    const h = Math.max(d < .95 ? .34 : .42, d * .45);

    v.gA.querySelectorAll('.arr:not(.tmp),.ahit').forEach(n => n.remove());
    (sol || arrows).forEach((a, i) => {
      const d = curve(a.pt, tgtPt(a.tgt), a.tgt.startsWith('a:'));
      if (!sol) { const h = sv('path', { class: 'ahit', d }); h.addEventListener('pointerdown', e => { if (armed || drag || cur.done) return; e.stopPropagation(); arrows.splice(i, 1); redraw(); }); v.gA.appendChild(h); }
      v.gA.appendChild(sv('path', { class: 'arr' + (sol ? ' sol' : ''), d, 'marker-end': `url(#${sol ? 'ahs' : 'ah'}${uid})` }));

  const tools = el('div', { class: 'tools' }); const clr = el('button', { class: 'btn' }, 'Clear'); const sb = el('button', { class: 'btn primary' }, 'Submit arrows');
  clr.onclick = () => { if (cur.done) return; arrows.length = 0; disarm(); redraw(); };
  sb.onclick = () => { if (cur.done || !arrows.length) return; const mine = arrows.map(a => a.src + '>' + a.tgt).sort().join(','); const ok = p.sol.some(s => s.slice().sort().join(',') === mine); sb.disabled = clr.disabled = true; if (!ok) cur.reveal(); finish(ok ? 1 : 0, ok); };
  tools.append(clr, sb); ans.appendChild(tools);
  cur.reveal = () => {
    sb.disabled = clr.disabled = true;
    const sol = p.sol[0].map(s => { const [src, tgt] = s.split('>'); const t = tgtPt(tgt); const spt = src.startsWith('lp:') ? v.geo.lps.filter(l => l.atom === src.slice(3)).sort((a, b) => Math.hypot(a.x - t.x, a.y - t.y) - Math.hypot(b.x - t.x, b.y - t.y))[0] : v.geo.bonds.get(src.slice(2)); return { src, tgt, pt: spt }; });

},
syn(p, stage, ans) {
  const S2 = p.syn, showY = p.c >= 2200; const best = bestRoute(S2);
  const goal = el('div', { class: 'syn-goal' });
  goal.innerHTML = `<span>Start</span><span class="chip">${S2.nodes[S2.start]}</span><span>Goal</span><span class="chip goal">${S2.nodes[S2.target]}</span>` + (S2.maxSteps ? `<span>· max ${S2.maxSteps} steps</span>` : '') + (S2.minYield ? `<span>· yield ≥ ${Math.round(S2.minYield * 100)} %</span>` : '') + (!showY ? '<span>· yields don\'t count here</span>' : '');
  stage.style.flexDirection = 'column'; stage.appendChild(goal);
  const route = el('div', { class: 'route' }), note = el('div', { class: 'note' }); stage.append(route, note);
  const shelf = el('div', { class: 'shelf' }); ans.appendChild(shelf);
  const tools = el('div', { class: 'tools' }); const undo = el('button', { class: 'btn' }, 'Undo step'), restart = el('button', { class: 'btn' }, 'Start over'); tools.append(undo, restart); ans.appendChild(tools);

  const at = () => steps.length ? steps[steps.length - 1].to : S2.start;
  const live = n => Object.values(S2.edges[n] || {}).some(e => e[0]);
  const arrowS = '<svg viewBox="0 0 100 12" preserveAspectRatio="none"><path d="M2 6 H94 M86 1 L96 6 L86 11" fill="none" stroke="#686c72" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>';
  function paint(list = steps) {
    route.innerHTML = `<span class="node">${S2.nodes[S2.start]}</span>`;
    list.forEach(s => { route.appendChild(el('div', { class: 'step' }, `<span>${S2.reagents[s.r]}</span>${arrowS}${showY ? `<span>${Math.round(s.y * 100)} %</span>` : ''}`)); route.appendChild(el('span', { class: 'node' + (s.to === S2.target ? ' hit' : !live(s.to) ? ' dead' : '') }, S2.nodes[s.to])); });
    undo.disabled = !steps.length || cur.revealed;

  for (const r in S2.reagents) {
    const b = el('button', {}, S2.reagents[r]);
    b.onclick = () => {
      if (locked) return; const e = (S2.edges[at()] || {})[r];
      if (!e) { note.className = 'note'; note.textContent = 'Unter diesen Bedingungen passiert nichts Sinnvolles.'; return; }

};
function bestRoute(p) {

}

/* ================= side panel ================= */
const ICON = { turn: '<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="4" fill="#686c72"/></svg>', ok: '<svg viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>', no: '<svg viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>' };

  const t1 = kind === 'turn' ? 'Your turn' : kind === 'ok' ? (cur.hinted ? 'Solved with a hint' : 'Correct') : cur.revealed ? 'Solution shown' : 'Incorrect';
  const t2 = kind === 'turn' ? (cur.p.i in S.done ? 'Already rated — practice' : 'This puzzle is rated') : (note || (kind === 'ok' ? 'Next puzzle coming up…' : 'Check the answer, then press Next.'));
  s.innerHTML = `<div class="icon">${ICON[kind]}</div><div><div class="t1">${t1}</div><div class="t2">${t2}</div></div>` + (delta != null ? `<div class="delta">${delta >= 0 ? '+' : '−'}${Math.abs(delta)}</div>` : '');
}
function renderMeta() {
  const p = cur.p, done = p.i in S.done;

}
function renderSide() {
  $('#celo').textContent = S.celo; $('#tier').textContent = tierOf(S.celo);
  const ids = Object.keys(S.done), solved = ids.filter(i => S.done[i] >= .75).length;
  $('#stats').innerHTML = `<span>Rated</span><b>${ids.length}</b><span>Solved</span><b>${ids.length ? Math.round(100 * solved / ids.length) : 0} %</b><span>Title</span><b>${tierOf(S.celo)}</b><span>Puzzles</span><b>${CP.P.length.toLocaleString('en')}</b>`;
  const dots = $('#dots'); dots.innerHTML = '';
  for (const [i, s] of S.hist.slice(-40)) { const b = el('button', { class: s >= .75 ? 's1' : s > 0 ? 'sh' : 's0', title: '#' + i + (BY.get(i) ? ' · ' + BY.get(i).c : '') }); b.onclick = () => BY.get(i) && show(BY.get(i)); dots.appendChild(b); }

/* ================= wiring ================= */
$('#explain').addEventListener('pointerdown', stopAuto);
$('#dots').addEventListener('pointerdown', stopAuto);
$('#hintBtn').onclick = () => {
  if (cur.done || cur.hinted) return; cur.hinted = true;
  const h = cur.p.hint || HINT[famOf(cur.p)]; const box = $('#explain');
  box.innerHTML = `<div class="h">Hint</div><p>${h}</p>`; box.hidden = false; $('#hintBtn').disabled = true;
};
$('#solBtn').onclick = () => { if (cur.revealed) return; cur.revealed = true; cur.reveal && cur.reveal(); if (!cur.graded) finish(0, false); else { setStatus('no', null); showExplain(false); } $('#solBtn').disabled = true; };

  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^[1-4]$/.test(e.key) && cur && !cur.done && cur.keys) { cur.keys(+e.key - 1); return; }

addEventListener('hashchange', () => { const p = BY.get(location.hash.slice(1)); if (p && (!cur || p !== cur.p)) show(p); });

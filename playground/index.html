<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<title>Chem Playground</title>
<meta name="description" content="Explore atoms and molecules in a 3D molecular-dynamics sandbox. Experimental chemistry, physical units, and a one-femtosecond clock.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Hanken+Grotesk:wght@400;500;600&family=Martian+Mono:wdth,wght@87.5,300;87.5,400;100,500;100,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20260922-build27">
<link rel="stylesheet" href="royal.css?v=20260922-build27">
</head>
<body>
<canvas id="field" aria-label="Simulation field with schematic atomic contours. Choose an element, then click to place; right-click an atom for calculated orbitals. Drag empty space to pan; scroll to zoom."></canvas>
<div class="top-line" aria-hidden="true"></div>

<!-- wordmark + live inventory -->
<header class="mark" id="mark">
  <a class="brand" href="../" title="All tools">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <path class="iso i1" d="M16 5.5c6.6 0 11 4.3 11 10.3S22.2 26.5 16 26.5 5 22.4 5 16.1 9.4 5.5 16 5.5z"/>
      <path class="iso i2" d="M15.6 9.6c4.3 0 6.9 2.8 6.9 6.5s-3 6.3-6.6 6.3-6.5-2.6-6.5-6.4 2.1-6.4 6.2-6.4z"/>
      <circle class="nuc" cx="16" cy="16" r="2.4"/>
    </svg>
    <span class="word">Chem <span class="word-light">Playground</span></span>
    <span class="status-dot" id="statusDot" title="Paused" hidden></span>
  </a>
</header>

<!-- conditions -->
<section class="gauges" id="gauges" aria-label="Conditions">
  <div class="gauge" id="gT">
    <button class="bb" id="bbDot" aria-label="Temperature and wall thermostat settings" title="Temperature settings">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path class="stem" d="M6.2 8.9V3.6a1.8 1.8 0 0 1 3.6 0v5.3a3 3 0 1 1-3.6 0z"/>
        <path class="ticks" d="M9.9 4.6h1.6M9.9 6.4h1.2M9.9 8.2h1.6"/>
        <circle class="bulb" cx="8" cy="11.1" r="1.9"/>
      </svg>
    </button>
    <span class="scrub" id="tField" data-unit="K" title="Target temperature — drag, scroll or click to type"></span>
    <span class="measured" id="tMeasured" title="Measured kinetic temperature, averaged over about 1 ps"><b id="tMeasuredVal"></b><i id="tMeasuredBand" aria-hidden="true"></i></span>
  </div>
  <div class="gauge" id="gP" role="button" tabindex="0" aria-label="Wall pressure and box dimensions" title="Mean normal wall stress, averaged over about 1 ps">
    <svg class="gi" viewBox="0 0 16 16"><path d="M2.5 11.5a5.5 5.5 0 1 1 11 0"/><path d="M8 11.5l2.8-3.6"/></svg>
    <span class="val" id="pVal">—</span>
  </div>
  <button class="gauge icon" id="menuBtn" title="Settings" aria-label="Open settings" aria-expanded="false" aria-controls="console">
    <svg class="gi apps" viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5" rx="1.4"/><rect x="9" y="2" width="5" height="5" rx="1.4"/><rect x="2" y="9" width="5" height="5" rx="1.4"/><rect x="9" y="9" width="5" height="5" rx="1.4"/></svg>
  </button>
</section>

<aside class="lab-readout pop" id="measurementsPanel" aria-label="Live measurements" inert>
  <div class="readout-heading">Sample <span id="atomCount">0 atoms</span></div>
  <div class="inventory" id="inventory" aria-live="polite"></div>
  <div><span>Kinetic temperature</span><strong id="liveTemperature">—</strong></div>
  <div><span>Total energy</span><strong id="liveEnergy">—</strong></div>
  <div><span>Bath</span><button id="bathBtn" aria-pressed="true">298 K · on</button></div>
  <button id="resampleBtn" class="resample" title="Sample fresh thermal velocities at the target temperature (Shift+T)">Resample thermal motion ↗</button>
  <div class="readout-foot">Playback <span id="rateDetail">paused</span></div>
  <p id="physicsNotice" class="physics-notice" role="status" hidden></p>
</aside>

<div class="tool-context" id="toolContext">Drag to pan · scroll to zoom</div>
<!-- tool + element dock -->
<div class="control-rail" id="controlRail">
<nav class="dock" id="dock" aria-label="Tools and elements">
  <div class="tools" id="tools"></div>
  <div class="rule"></div>
  <div class="elements" id="elements"></div>
  <button class="more" id="moreEl" title="Add atoms or molecules · right-click for molecules" aria-label="Add atoms or molecules" aria-haspopup="dialog" aria-expanded="false" aria-controls="elPop">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
  </button>
</nav>

<!-- transport -->
<section class="transport" id="transport" aria-label="Time">
  <button class="tbtn" id="backBtn" title="Step back 1 fs (hold to rewind)" aria-label="Step back">
    <svg viewBox="0 0 20 20"><path d="M13.5 5v10L6.5 10z"/><rect x="4" y="5" width="1.8" height="10" rx=".6"/></svg>
  </button>
  <button class="tbtn play" id="playBtn" title="Play / pause" aria-label="Play">
    <svg viewBox="0 0 20 20"><path id="playA" d="M6 4 L10.5 6.6 L10.5 13.4 L6 16 Z"/><path id="playB" d="M10.5 6.6 L15 9.2 L15 10.8 L10.5 13.4 Z"/></svg>
  </button>
  <button class="tbtn" id="fwdBtn" title="Step forward 1 fs (hold to run)" aria-label="Step forward">
    <svg viewBox="0 0 20 20"><path d="M6.5 5v10l7-5z"/><rect x="14.2" y="5" width="1.8" height="10" rx=".6"/></svg>
  </button>
  <div class="vr"></div>
  <div class="speed" id="speed">
    <span class="scrub" id="speedField" title="Simulation speed — drag, scroll or click to type"></span>
    <button class="caret" id="speedMenuBtn" aria-label="Speed presets"><svg viewBox="0 0 10 10"><path d="M2 3.8l3 3 3-3"/></svg></button>
  </div>
  <div class="vr"></div>
  <button class="clock" id="measurementsBtn" title="Sample measurements · right-click for playback presets" aria-label="Sample measurements" aria-expanded="false" aria-controls="measurementsPanel">
    <span class="t" id="clock">0 fs</span>
    <span class="rate" id="rate"></span>
  </button>
</section>
</div>

<!-- reaction feed -->
<ol class="feed" id="feed" aria-live="polite" aria-label="Reactions"></ol>

<!-- scale bar -->
<button class="scale" id="fitBtn" title="Fit chamber · right-click for display settings" aria-label="Fit chamber"><span id="scale"><i></i><span></span></span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3H3v3m7-3h3v3M3 10v3h3m7-3v3h-3"/></svg></button>

<!-- conditioning sheet -->
<section class="sheet" id="sheet" aria-label="Condition molecule" hidden>
  <canvas id="sheetCanvas" width="300" height="220"></canvas>
  <div class="sheet-body">
    <div class="sheet-title"><span id="sheetName"></span><small id="sheetFormula"></small></div>
    <div class="seg" id="condSeg" role="radiogroup">
      <button data-v="normal" role="radio">Room<small>298 K</small></button>
      <button data-v="zero" role="radio">Zero K<small>classical minimum</small></button>
      <button data-v="custom" role="radio">Custom<small id="customSmall">set below</small></button>
    </div>
    <div class="custom" id="customRow">
      <label>T <span class="scrub" id="cT" data-unit="K"></span></label>
      <label title="Ideal-gas pressure used only to estimate the confinement size; no barostat">P estimate <span class="scrub" id="cP" data-unit="bar"></span></label>
    </div>
    <label class="placement-rest"><input type="checkbox" id="placeAtRest"> Place with zero initial velocity</label>
    <details class="condition-note"><summary>Preview assumptions</summary><p>Isolated molecule. Pressure sets a nominal cell size, not an equilibrated bulk sample.</p></details>
    <div class="cond-status" id="condStatus"><i id="condBar"></i><span id="condText"></span></div>
    <div class="sheet-actions">
      <button class="ghost" id="condCancel">Cancel <kbd>Esc</kbd></button>
      <button class="primary" id="condPlace">Place <kbd>↵</kbd></button>
    </div>
  </div>
</section>

<!-- popovers -->
<div class="pop" id="speedPop" role="menu"></div>
<div class="pop" id="tPop"></div>
<div class="pop" id="pPop"></div>
<div class="pop periodic library" id="elPop" role="dialog" aria-label="Add atoms or molecules" inert>
  <div class="library-tabs" role="tablist" aria-label="Materials">
    <button id="atomsTab" role="tab" aria-selected="true" aria-controls="atomsPanel">Atoms</button>
    <button id="trayPill" role="tab" aria-selected="false" aria-controls="tray" tabindex="-1">Molecules <b id="trayCount">0</b></button>
  </div>
  <div class="library-content">
    <div id="atomsPanel" role="tabpanel" aria-labelledby="atomsTab"><div class="grid" id="periodicGrid"></div></div>
    <section id="tray" role="tabpanel" aria-labelledby="trayPill" hidden>  <div class="tray-panel" id="trayPanel">
    <div class="tray-head">
      <span>From Nomenclature</span>
      <a id="openNom" href="../nomenclature.html" target="_blank" rel="noopener">Draw one ↗</a>
    </div>
    <div class="tray-list" id="trayList"></div>
  </div></section>
  </div>
</div>
<div class="tip" id="tip"></div>

<!-- command palette -->
<div class="veil" id="cmdVeil" hidden>
  <div class="dialog cmd" role="dialog" aria-label="Command palette">
    <input id="cmdInput" autocomplete="off" spellcheck="false" placeholder="Type an action, an element, or “500 K”, “2x”, “3 bar”…">
    <ul id="cmdList"></ul>
  </div>
</div>

<!-- console: apps that sit on the scene rather than over it -->
<div class="console" id="console" hidden>
  <section class="console-win" id="consoleWin" role="dialog" aria-label="Simulation settings">
    <header class="console-bar" id="consoleBar">

      <h2 id="consoleTitle">Settings</h2>
      <span class="console-held" id="consoleHeld" hidden><b id="consoleClock">0 fs</b></span>
      <button class="console-x" id="consoleClose" aria-label="Close settings">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.6 4.6l6.8 6.8M11.4 4.6l-6.8 6.8"/></svg>
      </button>
    </header>
    <div class="console-body">
      <nav class="console-rail" id="consoleRail" role="tablist" aria-label="Apps"></nav>
      <div class="console-stage" id="consoleStage"></div>
    </div>
  </section>
</div>

<div class="toasts" id="toasts"></div>

<script src="engine.js?v=20260922-build27"></script>
<script src="protocol.js?v=20260922-build27"></script>
<script src="render.js?v=20260922-build27"></script>
<script src="inspector.js?v=20260922-build27"></script>
<script src="app.js?v=20260922-build27"></script>
</body>
</html>
